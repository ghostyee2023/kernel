<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse · 部署脉搏仪表盘</title>
<style>
  :root {
    --bg: hsl(220 20% 5%);
    --panel: hsl(222 18% 9%);
    --line: hsl(222 14% 18%);
    --text: hsl(220 20% 94%);
    --muted: hsl(220 10% 58%);
    --iris: hsl(233 60% 62%);
    --cyan: hsl(177 82% 45%);
    --magenta: hsl(328 72% 62%);
    --gold: hsl(43 72% 56%);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    padding: clamp(18px, 4vw, 40px);
    min-height: 100vh;
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: clamp(20px, 3vw, 28px); font-weight: 600; letter-spacing: -0.8px; }
  .sub { font-size: 13px; color: var(--muted); }
  .live {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--cyan);
    border: 1px solid hsl(177 82% 45% / 0.3); border-radius: 999px;
    padding: 5px 12px; background: hsl(177 82% 45% / 0.08);
  }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s var(--ease) infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .kpi__label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .kpi__value { font-size: 26px; font-weight: 600; letter-spacing: -1px; }
  .kpi__delta { font-size: 12px; margin-top: 6px; }
  .up { color: var(--cyan); }
  .down { color: var(--magenta); }

  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 14px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 2px; border-radius: 2px; display: block; }

  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar__row { display: grid; grid-template-columns: 78px 1fr 52px; align-items: center; gap: 10px; font-size: 12px; }
  .bar__track { height: 8px; border-radius: 999px; background: hsl(222 14% 16%); overflow: hidden; }
  .bar__fill { height: 100%; border-radius: 999px; width: 0; transition: width 1.1s var(--ease); }
  .bar__val { text-align: right; color: var(--muted); }

  footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Pulse · 部署脉搏</h1>
    <p class="sub">近 24 小时静态作品发布与访问概览 · 数据为演示用确定性伪随机序列</p>
  </div>
  <span class="live"><i></i>LIVE</span>
</header>

<section class="kpis" id="kpis"></section>

<div class="grid">
  <section class="panel">
    <h2>访问量趋势（每小时）</h2>
    <svg id="lineChart" viewBox="0 0 640 240" role="img" aria-label="访问量趋势折线图"></svg>
    <div class="legend">
      <span><i style="background: var(--iris)"></i>页面浏览</span>
      <span><i style="background: var(--cyan)"></i>沙箱运行</span>
      <span><i style="background: var(--magenta)"></i>分享点击</span>
    </div>
  </section>

  <section class="panel">
    <h2>来源分布</h2>
    <div class="bars" id="bars"></div>
  </section>
</div>

<footer class="mono" id="stamp">--</footer>

<script>
(function () {
  'use strict';

  /** 确定性伪随机（线性同余），保证每次刷新图形一致。 */
  function makeRng(seed) {
    var state = seed >>> 0;
    return function () {
      state = (state * 1664525 + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  var rng = makeRng(20260806);
  var HOURS = 24;

  /** 生成一条带日内节律的序列。 */
  function series(base, amplitude, jitter) {
    var out = [];
    for (var h = 0; h < HOURS; h++) {
      var rhythm = Math.sin(((h - 6) / HOURS) * Math.PI * 2) * 0.5 + 0.5;
      out.push(Math.round(base + amplitude * rhythm + (rng() - 0.5) * jitter));
    }
    return out;
  }

  var views = series(120, 260, 46);
  var runs = series(70, 160, 34);
  var shares = series(18, 52, 16);

  /** 求和。 */
  function sum(arr) {
    return arr.reduce(function (a, b) { return a + b; }, 0);
  }

  /** 千分位格式化。 */
  function fmt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* ------------------------------------------------------------- KPI 卡片 */
  var kpiData = [
    { label: '页面浏览', value: sum(views), delta: '+12.4%', dir: 'up' },
    { label: '沙箱运行', value: sum(runs), delta: '+8.1%', dir: 'up' },
    { label: '分享点击', value: sum(shares), delta: '-2.6%', dir: 'down' },
    { label: '在线作品', value: 342, delta: '+5 今日', dir: 'up' }
  ];

  document.getElementById('kpis').innerHTML = kpiData.map(function (k) {
    return '<div class="kpi">' +
      '<div class="kpi__label">' + k.label + '</div>' +
      '<div class="kpi__value mono">' + fmt(k.value) + '</div>' +
      '<div class="kpi__delta ' + k.dir + '">' + k.delta + '</div>' +
      '</div>';
  }).join('');

  /* ------------------------------------------------------------- 折线图 */
  var W = 640, H = 240, PAD_L = 44, PAD_R = 12, PAD_T = 12, PAD_B = 28;
  var maxY = Math.max.apply(null, views) * 1.12;

  /** 数据点 → SVG 坐标。 */
  function toX(i) { return PAD_L + (i / (HOURS - 1)) * (W - PAD_L - PAD_R); }
  function toY(v) { return H - PAD_B - (v / maxY) * (H - PAD_T - PAD_B); }

  /** 生成平滑折线路径。 */
  function pathOf(data) {
    var d = 'M ' + toX(0).toFixed(1) + ' ' + toY(data[0]).toFixed(1);
    for (var i = 1; i < data.length; i++) {
      var x0 = toX(i - 1), y0 = toY(data[i - 1]);
      var x1 = toX(i), y1 = toY(data[i]);
      var cx = (x0 + x1) / 2;
      d += ' C ' + cx.toFixed(1) + ' ' + y0.toFixed(1) + ', ' + cx.toFixed(1) + ' ' + y1.toFixed(1) +
           ', ' + x1.toFixed(1) + ' ' + y1.toFixed(1);
    }
    return d;
  }

  var parts = [];
  parts.push('<defs><linearGradient id="fillIris" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="hsl(233 60% 62% / 0.28)"/>' +
    '<stop offset="100%" stop-color="hsl(233 60% 62% / 0)"/></linearGradient></defs>');

  for (var g = 0; g <= 4; g++) {
    var gy = PAD_T + (g / 4) * (H - PAD_T - PAD_B);
    var gv = Math.round(maxY * (1 - g / 4));
    parts.push('<line x1="' + PAD_L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PAD_R) +
      '" y2="' + gy.toFixed(1) + '" stroke="hsl(222 14% 18%)" stroke-width="1"/>');
    parts.push('<text x="' + (PAD_L - 8) + '" y="' + (gy + 4).toFixed(1) +
      '" text-anchor="end" font-size="10" fill="hsl(220 10% 58%)" font-family="monospace">' + gv + '</text>');
  }

  var areaPath = pathOf(views) + ' L ' + toX(HOURS - 1).toFixed(1) + ' ' + (H - PAD_B) +
    ' L ' + toX(0).toFixed(1) + ' ' + (H - PAD_B) + ' Z';
  parts.push('<path d="' + areaPath + '" fill="url(#fillIris)"/>');

  parts.push('<path d="' + pathOf(views) + '" fill="none" stroke="hsl(233 60% 62%)" stroke-width="2.2" stroke-linecap="round"/>');
  parts.push('<path d="' + pathOf(runs) + '" fill="none" stroke="hsl(177 82% 45%)" stroke-width="1.8" stroke-linecap="round"/>');
  parts.push('<path d="' + pathOf(shares) + '" fill="none" stroke="hsl(328 72% 62%)" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>');

  for (var t = 0; t < HOURS; t += 4) {
    parts.push('<text x="' + toX(t).toFixed(1) + '" y="' + (H - 8) +
      '" text-anchor="middle" font-size="10" fill="hsl(220 10% 58%)" font-family="monospace">' +
      (t < 10 ? '0' + t : t) + ':00</text>');
  }

  document.getElementById('lineChart').innerHTML = parts.join('');

  /* ------------------------------------------------------------- 条形图 */
  var sources = [
    { name: '直接访问', value: 38, color: 'hsl(233 60% 62%)' },
    { name: '分享短链', value: 31, color: 'hsl(177 82% 45%)' },
    { name: '广场推荐', value: 19, color: 'hsl(328 72% 62%)' },
    { name: '搜索引擎', value: 8, color: 'hsl(43 72% 56%)' },
    { name: '其他', value: 4, color: 'hsl(220 10% 48%)' }
  ];

  document.getElementById('bars').innerHTML = sources.map(function (s) {
    return '<div class="bar__row">' +
      '<span>' + s.name + '</span>' +
      '<span class="bar__track"><i class="bar__fill" data-w="' + s.value + '" style="background:' + s.color + '"></i></span>' +
      '<span class="bar__val mono">' + s.value + '%</span>' +
      '</div>';
  }).join('');

  requestAnimationFrame(function () {
    var fills = document.querySelectorAll('.bar__fill');
    for (var i = 0; i < fills.length; i++) {
      fills[i].style.width = fills[i].getAttribute('data-w') + '%';
    }
  });

  document.getElementById('stamp').textContent =
    'snapshot · seed=20260806 · rendered at ' + new Date().toISOString().slice(0, 19).replace('T', ' ') + 'Z';
})();
</script>
</body>
</html>
